spring.application.name=kees-backend

spring.datasource.url=${KEES_DB_URL:jdbc:postgresql://localhost:5432/kees}
spring.datasource.username=${KEES_DB_USERNAME:kees}
spring.datasource.password=${KEES_DB_PASSWORD:kees}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

kees.chunking.max-characters=2000

kees.source-upload.max-file-size=5MB

spring.servlet.multipart.max-file-size=${kees.source-upload.max-file-size}
spring.servlet.multipart.max-request-size= 6MB

kees.storage.bucket=${KEES_STORAGE_BUCKET:kees-sources}
kees.storage.region=${KEES_STORAGE_REGION:eu-west-1}
kees.storage.endpoint=${KEES_STORAGE_ENDPOINT:http://localhost:9000}
kees.storage.access-key=${KEES_STORAGE_ACCESS_KEY:kees}
kees.storage.secret-key=${KEES_STORAGE_SECRET_KEY:kees-secret-key}
kees.storage.path-style=${KEES_STORAGE_PATH_STYLE:true}
