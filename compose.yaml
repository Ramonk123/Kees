name: kees

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: kees
      POSTGRES_USER: kees
      POSTGRES_PASSWORD: kees
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kees -d kees"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
